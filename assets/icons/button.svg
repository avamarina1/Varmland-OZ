<svg xmlns="http://www.w3.org/2000/svg" width="700" height="700" viewBox="0 0 700 700">
  <title>Four-hole button</title>
  <desc>Clean vector recreation of the uploaded black button icon.</desc>

  <!-- Outer button -->
  <circle cx="350" cy="350" r="320" fill="#000000"/>

  <!-- Inner circular groove -->
  <circle cx="350" cy="350" r="245"
          fill="none" stroke="#ffffff" stroke-width="8"/>

  <!-- Button holes -->
  <circle cx="280" cy="280" r="43" fill="#ffffff"/>
  <circle cx="420" cy="280" r="43" fill="#ffffff"/>
  <circle cx="280" cy="420" r="43" fill="#ffffff"/>
  <circle cx="420" cy="420" r="43" fill="#ffffff"/>
</svg>
